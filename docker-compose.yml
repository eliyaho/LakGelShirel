version: "3.8"

services:
  nextjs:
    container_name: nextjs-dev
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
    - NODE_ENV=development
    - MONGODB_URI=mongodb://mongo:27017/gal_nails

    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: mongo-dev
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
